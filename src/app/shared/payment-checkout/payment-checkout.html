<div class="space-y-2">
  @if (error()) {
    <p class="text-[11px] text-red-500">{{ error() }}</p>
  }
  <button (click)="payAndEnroll()" [disabled]="loading()"
    class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-xs font-bold shadow-md hover:shadow-lg transition-all cursor-pointer border-none flex items-center justify-center gap-1.5">
    {{ loading() ? 'Processing…' : 'Pay with Razorpay (Live)' }}
  </button>
</div>
